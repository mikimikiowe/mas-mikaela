<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- the PRUNUS J-150 in the infographic's line-art style, with its peach and sage squares and labelled parts -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2D78"/>
      <stop offset="1" stop-color="#2A2058"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#f5dccb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5dccb" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#120a33" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle cx="62" cy="48" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="430" r="1.1" opacity="0.6"/>
    <circle cx="740" cy="460" r="1.2" opacity="0.6"/>
    <circle cx="776" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="40" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="420" cy="34" r="0.9" opacity="0.5"/>
  </g>

  <!-- squares, like the ones scattered across the infographic -->
  <rect x="150" y="150" width="190" height="190" fill="#f5dccb" opacity="0.9"/>
  <rect x="120" y="120" width="70" height="70" fill="#a9c6a8" opacity="0.9"/>
  <rect x="170" y="98" width="40" height="40" fill="#cfe0ce" opacity="0.8"/>
  <rect x="420" y="250" width="170" height="170" fill="#ebc9b0" opacity="0.85"/>
  <rect x="560" y="380" width="56" height="56" fill="#a9c6a8" opacity="0.85"/>
  <rect x="604" y="420" width="30" height="30" fill="#cfe0ce" opacity="0.8"/>

  <g stroke="#231f20" stroke-linecap="round" stroke-linejoin="round">

    <!-- handle -->
    <path d="M262 214 C262 112, 438 112, 438 214" stroke-width="18"/>
    <rect x="330" y="186" width="40" height="26" rx="5" fill="#231f20"/>

    <!-- body -->
    <g filter="url(#shadow)">
      <rect x="196" y="206" width="350" height="206" rx="62" fill="#ffffff" stroke-width="4"/>
    </g>
    <rect x="214" y="224" width="314" height="170" rx="46" stroke-width="2.5"/>
    <path d="M226 260 C 236 240, 250 232, 268 230" stroke-width="1.5"/>
    <path d="M500 382 C 512 374, 518 362, 520 346" stroke-width="1.5"/>

    <!-- grille -->
    <g stroke-width="2.5" fill="#ffffff">
      <rect x="240" y="252" width="12" height="112" rx="6"/>
      <rect x="258" y="248" width="12" height="120" rx="6"/>
      <rect x="276" y="246" width="12" height="124" rx="6"/>
      <rect x="294" y="246" width="12" height="124" rx="6"/>
      <rect x="312" y="246" width="12" height="124" rx="6"/>
      <rect x="330" y="248" width="12" height="120" rx="6"/>
      <rect x="348" y="252" width="12" height="112" rx="6"/>
    </g>

    <!-- dial and bluetooth buttons -->
    <rect x="378" y="244" width="130" height="74" rx="10" fill="#ffffff" stroke-width="2.5"/>
    <rect x="388" y="252" width="32" height="10" rx="2" stroke-width="2"/>
    <rect x="427" y="252" width="32" height="10" rx="2" stroke-width="2"/>
    <rect x="466" y="252" width="32" height="10" rx="2" stroke-width="2"/>
    <path d="M388 276 H498 M388 292 H498 M388 306 H498" stroke-width="1.25"/>
    <path d="M462 270 V312" stroke-width="2.5"/>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" fill="#231f20">
    <text x="390" y="286">FM 88 • 92 • 96 • 100 • 104</text>
    <text x="390" y="301">AM 53 • 75 • 100 • 130</text>
  </g>

  <!-- knobs and mode switch -->
  <g stroke="#231f20" stroke-linecap="round">
    <circle cx="398" cy="352" r="20" fill="#ffffff" stroke-width="3"/>
    <circle cx="398" cy="352" r="12" stroke-width="1.5"/>
    <circle cx="492" cy="350" r="26" fill="#ffffff" stroke-width="3"/>
    <circle cx="492" cy="350" r="16" stroke-width="1.5"/>
    <path d="M492 334 L492 350 M478 342 L492 350 M506 342 L492 350" stroke-width="1.5"/>
    <rect x="428" y="356" width="34" height="16" rx="8" fill="#ffffff" stroke-width="2"/>
    <circle cx="438" cy="364" r="4.5" fill="#231f20"/>
  </g>
  <text x="443" y="344" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="9" fill="#231f20">PRUNUS</text>

  <!-- feet -->
  <rect x="250" y="410" width="40" height="8" rx="3" fill="#231f20"/>
  <rect x="452" y="410" width="40" height="8" rx="3" fill="#231f20"/>

  <!-- telescoping antenna: three sections that narrow toward the tip, on a hinged mount -->
  <g stroke="#231f20" stroke-linecap="round" stroke-linejoin="round" transform="translate(522 216) rotate(31.5)">
    <rect x="-6" y="-64" width="12" height="60" rx="2" fill="#ffffff" stroke-width="3"/>
    <rect x="-4.5" y="-120" width="9" height="58" rx="1.5" fill="#ffffff" stroke-width="2.75"/>
    <rect x="-3" y="-168" width="6" height="50" rx="1" fill="#ffffff" stroke-width="2.5"/>
    <rect x="-8" y="-69" width="16" height="7" rx="2" fill="#231f20"/>
    <rect x="-6.5" y="-124" width="13" height="6" rx="1.5" fill="#231f20"/>
    <circle cy="-175" r="8" fill="#ffffff" stroke-width="3"/>
    <circle cy="-175" r="2.5" fill="#231f20" stroke="none"/>
    <rect x="-11" y="-9" width="22" height="18" rx="5" fill="#ffffff" stroke-width="3"/>
    <circle r="3.5" fill="#231f20" stroke="none"/>
  </g>

  <!-- labels, as on the infographic -->
  <g stroke="#F6F2FF" stroke-width="1.5" opacity="0.9">
    <path d="M598 92 H668"/>
    <path d="M540 236 H668"/>
    <path d="M506 270 L540 270 L540 300 H668"/>
    <path d="M518 350 H668"/>
  </g>
  <g fill="#F6F2FF" opacity="0.9">
    <circle cx="598" cy="92" r="3"/>
    <circle cx="540" cy="236" r="3"/>
    <circle cx="506" cy="270" r="3"/>
    <circle cx="518" cy="350" r="3"/>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2FF">
    <text x="676" y="97">Antenna</text>
    <text x="676" y="241">Solar panel</text>
    <text x="676" y="305">Bluetooth</text>
    <text x="676" y="355">Tuning knob</text>
  </g>
</svg>
