<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- four organizer sources flow into one events site, drawn in the site's own Sheridan colours -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2D78"/>
      <stop offset="1" stop-color="#2A2058"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#c4ebf2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c4ebf2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="window">
      <rect x="292" y="72" width="468" height="356" rx="16"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#120a33" flood-opacity="0.55"/>
    </filter>
    <filter id="poster_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#003767" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- a few quiet stars -->
  <g fill="#ffffff">
    <circle cx="62" cy="48" r="1.2" opacity="0.7"/>
    <circle cx="214" cy="92" r="0.9" opacity="0.5"/>
    <circle cx="150" cy="420" r="1.3" opacity="0.6"/>
    <circle cx="258" cy="452" r="0.8" opacity="0.5"/>
    <circle cx="776" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="560" cy="470" r="1" opacity="0.5"/>
    <circle cx="40" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="700" cy="460" r="1.2" opacity="0.6"/>
  </g>

  <!-- sources -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F6F2FF">
    <g>
      <rect x="40" y="118" width="164" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="64" cy="140" r="7" fill="#00b2ce"/>
      <text x="80" y="145">SSU</text>
    </g>
    <g>
      <rect x="40" y="186" width="164" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="64" cy="208" r="7" fill="#c7da30"/>
      <text x="80" y="213">Sheridan Clubs</text>
    </g>
    <g>
      <rect x="40" y="254" width="164" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="64" cy="276" r="7" fill="#ce2a74"/>
      <text x="80" y="281">EDGE</text>
    </g>
    <g>
      <rect x="40" y="322" width="164" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
      <circle cx="64" cy="344" r="7" fill="#8cc63e"/>
      <text x="80" y="349">Sheridan College</text>
    </g>
  </g>

  <g stroke="#CDB8FF" stroke-width="1.75" stroke-dasharray="5 6" stroke-linecap="round" opacity="0.85">
    <path d="M206 140 C 250 140, 250 250, 290 250"/>
    <path d="M206 208 C 250 208, 250 250, 290 250"/>
    <path d="M206 276 C 250 276, 250 250, 290 250"/>
    <path d="M206 344 C 250 344, 250 250, 290 250"/>
  </g>
  <circle cx="290" cy="250" r="4" fill="#FFC6EC"/>

  <!-- the site -->
  <g filter="url(#shadow)">
    <rect x="292" y="72" width="468" height="356" rx="16" fill="#f4f7fa"/>
  </g>
  <g clip-path="url(#window)">
    <!-- top bar and nav -->
    <rect x="292" y="72" width="468" height="20" fill="#003767"/>
    <rect x="306" y="80" width="110" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="676" y="80" width="70" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="292" y="92" width="468" height="34" fill="#ffffff"/>
    <text x="308" y="114" font-family="'Roboto Slab', Georgia, serif" font-weight="700" font-size="13" fill="#003767">What's New at Sheridan</text>
    <rect x="490" y="106" width="34" height="5" rx="2.5" fill="#333940" opacity="0.55"/>
    <rect x="532" y="106" width="40" height="5" rx="2.5" fill="#333940" opacity="0.55"/>
    <rect x="580" y="106" width="30" height="5" rx="2.5" fill="#333940" opacity="0.55"/>
    <rect x="580" y="114" width="30" height="2" rx="1" fill="#ec008b"/>
    <rect x="684" y="100" width="62" height="18" rx="9" fill="#003767"/>

    <!-- hero -->
    <rect x="292" y="126" width="468" height="170" fill="#c4ebf2"/>
    <rect x="292" y="276" width="468" height="20" fill="#e2f5f8"/>
    <rect x="470" y="150" width="12" height="2.5" rx="1.25" fill="#00b2ce"/>
    <rect x="488" y="149" width="74" height="4" rx="2" fill="#333940" opacity="0.6"/>
    <text x="526" y="184" text-anchor="middle" font-family="'Roboto Slab', Georgia, serif" font-weight="700" font-size="23" fill="#003767">Something worth</text>
    <text x="526" y="210" text-anchor="middle" font-family="'Roboto Slab', Georgia, serif" font-weight="700" font-size="23" fill="#003767">showing up for</text>
    <rect x="452" y="224" width="148" height="4" rx="2" fill="#333940" opacity="0.5"/>
    <rect x="466" y="233" width="120" height="4" rx="2" fill="#333940" opacity="0.5"/>
    <rect x="482" y="246" width="88" height="18" rx="9" fill="#003767"/>

    <!-- event posters on either side of the headline -->
    <g filter="url(#poster_shadow)">
      <g transform="rotate(-4 336 238)">
        <rect x="306" y="196" width="58" height="84" fill="#ffffff"/>
        <rect x="312" y="202" width="46" height="32" fill="#c4ebf2"/>
        <rect x="316" y="208" width="30" height="5" fill="#003767"/>
        <rect x="316" y="217" width="22" height="5" fill="#ec008b"/>
        <rect x="306" y="240" width="58" height="40" fill="#00b2ce"/>
        <rect x="312" y="248" width="20" height="3" fill="#231f20"/>
        <rect x="312" y="256" width="42" height="4" fill="#231f20"/>
        <rect x="312" y="264" width="30" height="3" fill="#231f20" opacity="0.7"/>
      </g>
      <g transform="rotate(3 400 240)">
        <rect x="372" y="200" width="56" height="82" fill="#ffffff"/>
        <rect x="378" y="206" width="44" height="30" fill="#fff100" opacity="0.55"/>
        <circle cx="400" cy="221" r="9" fill="#ce2a74" opacity="0.8"/>
        <rect x="372" y="242" width="56" height="40" fill="#003767"/>
        <rect x="378" y="250" width="18" height="3" fill="#ffffff"/>
        <rect x="378" y="258" width="40" height="4" fill="#ffffff"/>
        <rect x="378" y="266" width="28" height="3" fill="#ffffff" opacity="0.7"/>
      </g>
      <g transform="rotate(-3 656 240)">
        <rect x="628" y="200" width="56" height="82" fill="#ffffff"/>
        <rect x="634" y="206" width="44" height="30" fill="#652c90" opacity="0.85"/>
        <rect x="640" y="214" width="32" height="5" fill="#fff100"/>
        <rect x="628" y="242" width="56" height="40" fill="#c7da30"/>
        <rect x="634" y="250" width="26" height="3" fill="#231f20"/>
        <rect x="634" y="258" width="40" height="4" fill="#231f20"/>
        <rect x="634" y="266" width="28" height="3" fill="#231f20" opacity="0.7"/>
      </g>
      <g transform="rotate(5 720 236)">
        <rect x="692" y="194" width="58" height="84" fill="#ffffff"/>
        <rect x="698" y="200" width="46" height="32" fill="#e2f5f8"/>
        <rect x="702" y="206" width="34" height="6" fill="#231f20"/>
        <rect x="702" y="216" width="24" height="6" fill="#231f20"/>
        <rect x="692" y="238" width="58" height="40" fill="#ce2a74"/>
        <rect x="698" y="246" width="18" height="3" fill="#ffffff"/>
        <rect x="698" y="254" width="44" height="4" fill="#ffffff"/>
        <rect x="698" y="262" width="30" height="3" fill="#ffffff" opacity="0.7"/>
      </g>
    </g>

    <!-- "this week" list below the fold -->
    <rect x="318" y="310" width="210" height="130" fill="#ffffff"/>
    <rect x="528" y="310" width="210" height="130" fill="#e0eff4"/>
    <rect x="334" y="326" width="10" height="2.5" rx="1.25" fill="#00b2ce"/>
    <rect x="350" y="325" width="60" height="4" rx="2" fill="#333940" opacity="0.6"/>
    <text x="334" y="350" font-family="'Roboto Slab', Georgia, serif" font-weight="700" font-size="13" fill="#003767">Your week, at a glance.</text>
    <g fill="#333940">
      <rect x="334" y="366" width="26" height="4" rx="2" opacity="0.5"/>
      <rect x="368" y="366" width="120" height="4" rx="2" fill="#003767"/>
      <rect x="334" y="382" width="26" height="4" rx="2" opacity="0.5"/>
      <rect x="368" y="382" width="96" height="4" rx="2" fill="#003767"/>
      <rect x="334" y="398" width="26" height="4" rx="2" opacity="0.5"/>
      <rect x="368" y="398" width="110" height="4" rx="2" fill="#003767"/>
    </g>
    <g filter="url(#poster_shadow)">
      <rect x="566" y="330" width="62" height="96" fill="#ffffff"/>
      <rect x="572" y="336" width="50" height="40" fill="#fff100" opacity="0.5"/>
      <rect x="578" y="346" width="38" height="6" fill="#231f20"/>
      <rect x="578" y="356" width="26" height="6" fill="#ce2a74"/>
      <rect x="566" y="382" width="62" height="44" fill="#ce2a74"/>
      <rect x="572" y="390" width="20" height="3" fill="#ffffff"/>
      <rect x="572" y="398" width="46" height="4" fill="#ffffff"/>
      <rect x="638" y="330" width="62" height="96" fill="#ffffff"/>
      <rect x="644" y="336" width="50" height="40" fill="#c4ebf2"/>
      <circle cx="669" cy="356" r="11" fill="#652c90" opacity="0.8"/>
      <rect x="638" y="382" width="62" height="44" fill="#00b2ce"/>
      <rect x="644" y="390" width="20" height="3" fill="#231f20"/>
      <rect x="644" y="398" width="46" height="4" fill="#231f20"/>
    </g>
  </g>
</svg>
